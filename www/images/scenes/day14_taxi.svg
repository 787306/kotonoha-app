<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Tokyo Taxi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#3B6E8C"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Tokyo Tower silhouette in twilight -->
      <polygon points="620,65 565,335 675,335" fill="none" stroke="#FB7185" stroke-width="6"/>
      <line x1="590" y1="210" x2="650" y2="210" stroke="#F8FAFC" stroke-width="6"/>
      <line x1="604" y1="145" x2="636" y2="145" stroke="#F8FAFC" stroke-width="5"/>
      <circle cx="145" cy="95" r="32" fill="#FEF08A"/>
      <!-- Road -->
      <rect x="0" y="335" width="800" height="165" fill="#334155"/>
      <line x1="40" y1="425" x2="170" y2="425" stroke="#FACC15" stroke-width="8" stroke-dasharray="60 40"/>
      <line x1="250" y1="425" x2="760" y2="425" stroke="#FACC15" stroke-width="8" stroke-dasharray="60 40"/>
      <!-- Japanese Classic Taxi -->
      <path d="M130 335 L165 235 Q180 212 215 212 L405 212 Q445 212 465 245 L515 268 Q545 278 545 315 L545 360 L115 360 L115 340 Z" fill="#10B981" stroke="#3B5259" stroke-width="3.5"/>
      <rect x="115" y="315" width="430" height="16" fill="#FACC15"/>
      <!-- Roof TAXI lantern -->
      <rect x="275" y="182" width="86" height="30" rx="8" fill="#FEF08A" stroke="#3B5259" stroke-width="2.5"/>
      <text x="318" y="203" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="16" fill="#0F172A">TAXI</text>
      <!-- Windows -->
      <path d="M185 280 L212 228 L312 228 L312 280 Z" fill="#E0F2FE" stroke="#3B5259" stroke-width="2.5"/>
      <path d="M328 280 L328 228 L415 228 L448 280 Z" fill="#E0F2FE" stroke="#3B5259" stroke-width="2.5"/>
      <!-- Red Vacant Sign 空車 -->
      <rect x="380" y="255" width="54" height="22" rx="4" fill="#EF4444"/>
      <text x="407" y="271" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">空車</text>
      <!-- Wheels -->
      <circle cx="215" cy="360" r="38" fill="#1E293B" stroke="#E2E8F0" stroke-width="6"/>
      <circle cx="455" cy="360" r="38" fill="#1E293B" stroke="#E2E8F0" stroke-width="6"/>
    
</svg>
