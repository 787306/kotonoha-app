<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Clinic and Drugstore">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF9FA"/>
      <stop offset="100%" stop-color="#DCF2F5"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Pharmacy Counter -->
      <rect x="70" y="290" width="660" height="210" rx="16" fill="#FFFFFF" stroke="#3B5259" stroke-width="3"/>
      <rect x="70" y="290" width="660" height="26" rx="6" fill="#0D9488"/>
      <!-- Cross / Medicine Emblem -->
      <circle cx="215" cy="155" r="66" fill="#FFFFFF" stroke="#0D9488" stroke-width="4"/>
      <rect x="197" y="113" width="36" height="84" rx="8" fill="#10B981"/>
      <rect x="173" y="137" width="84" height="36" rx="8" fill="#10B981"/>
      <!-- Prescription Medicine Bag -->
      <rect x="355" y="135" width="150" height="155" rx="10" fill="#FFFBEB" stroke="#3B5259" stroke-width="3"/>
      <rect x="355" y="135" width="150" height="34" rx="10" fill="#0EA5E9"/>
      <text x="430" y="158" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">お薬手帳</text>
      <line x1="382" y1="200" x2="478" y2="200" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
      <line x1="382" y1="224" x2="462" y2="224" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
      <line x1="382" y1="248" x2="448" y2="248" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
      <!-- Medicine Bottle & Capsules -->
      <rect x="555" y="185" width="66" height="105" rx="12" fill="#FEF3C7" stroke="#3B5259" stroke-width="3"/>
      <rect x="565" y="165" width="46" height="22" rx="6" fill="#0D9488" stroke="#3B5259" stroke-width="2.5"/>
      <rect x="565" y="218" width="46" height="38" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <!-- Capsules -->
      <g transform="rotate(-25 675 255)">
        <rect x="645" y="242" width="56" height="24" rx="12" fill="#FB7185" stroke="#3B5259" stroke-width="2.2"/>
        <rect x="673" y="242" width="28" height="24" rx="12" fill="#FFFFFF" stroke="#3B5259" stroke-width="2.2"/>
      </g>
    
</svg>
