<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Weekend Hobby and Park Plans">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF1F5"/>
      <stop offset="100%" stop-color="#E0F7FA"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Park grass & pathway -->
      <path d="M0 330 Q400 295 800 330 L800 500 L0 500 Z" fill="#A7F3D0"/>
      <!-- Sakura tree -->
      <path d="M120 350 Q135 230 105 140" fill="none" stroke="#8C6249" stroke-width="24" stroke-linecap="round"/>
      <circle cx="110" cy="115" r="78" fill="#FBCFE8" opacity="0.92"/>
      <circle cx="185" cy="145" r="62" fill="#F9A8D4" opacity="0.85"/>
      <circle cx="55" cy="155" r="55" fill="#FCE7F3"/>
      <!-- Park wooden bench -->
      <rect x="260" y="285" width="340" height="36" rx="8" fill="url(#wood)" stroke="#3B5259" stroke-width="2.5"/>
      <rect x="260" y="332" width="340" height="26" rx="6" fill="#D9A773" stroke="#3B5259" stroke-width="2.5"/>
      <rect x="295" y="358" width="16" height="58" fill="#3B5259"/>
      <rect x="550" y="358" width="16" height="58" fill="#3B5259"/>
      <!-- Retro Camera on bench -->
      <rect x="315" y="280" width="102" height="68" rx="12" fill="#334155" stroke="#3B5259" stroke-width="2.5"/>
      <rect x="335" y="266" width="36" height="16" rx="4" fill="#CBD5E1" stroke="#3B5259" stroke-width="2"/>
      <circle cx="366" cy="314" r="22" fill="#E2E8F0" stroke="#3B5259" stroke-width="2.5"/>
      <circle cx="366" cy="314" r="12" fill="#0D9488"/>
      <!-- Two Cinema Tickets -->
      <g transform="rotate(-10 510 305)">
        <rect x="460" y="278" width="110" height="54" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
        <text x="515" y="302" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="14" fill="#B45309">CINEMA</text>
        <text x="515" y="320" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#D97706">SAT 14:00</text>
      </g>
      <!-- Floating sakura petals -->
      <ellipse cx="420" cy="130" rx="10" ry="5" fill="#F472B6" transform="rotate(25 420 130)"/>
      <ellipse cx="560" cy="175" rx="9" ry="4" fill="#F472B6" transform="rotate(-20 560 175)"/>
      <ellipse cx="680" cy="120" rx="11" ry="5" fill="#F9A8D4" transform="rotate(40 680 120)"/>
    
</svg>
