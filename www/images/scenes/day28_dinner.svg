<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Business Dinner Etiquette">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C2538"/>
      <stop offset="100%" stop-color="#42364F"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Private Japanese Dining Room Shoji Glow -->
      <rect x="85" y="40" width="630" height="225" rx="14" fill="#FEF3C7" opacity="0.22" stroke="#FDE68A" stroke-width="2.5"/>
      <!-- Lacquer Table -->
      <rect x="0" y="295" width="800" height="205" fill="#4B2E2B" stroke="#1E1B18" stroke-width="3"/>
      <!-- Sake Bottle (Tokkuri) & Two Ochoko Cups -->
      <path d="M210 210 Q235 210 235 245 Q265 268 265 325 L185 325 Q185 268 215 245 Q215 210 210 210 Z" fill="#F8FAFC" stroke="#3B5259" stroke-width="3"/>
      <rect x="208" y="200" width="34" height="14" rx="4" fill="#0F766E"/>
      <path d="M295 305 L345 305 L335 342 L305 342 Z" fill="#FFFFFF" stroke="#3B5259" stroke-width="2.5"/>
      <path d="M365 305 L415 305 L405 342 L375 342 Z" fill="#FFFFFF" stroke="#3B5259" stroke-width="2.5"/>
      <!-- Sashimi Platter -->
      <rect x="460" y="290" width="240" height="125" rx="18" fill="#1E293B" stroke="#FBBF24" stroke-width="3"/>
      <ellipse cx="530" cy="348" rx="34" ry="20" fill="#FB7185" transform="rotate(-15 530 348)"/>
      <ellipse cx="585" cy="348" rx="34" ry="20" fill="#F97316" transform="rotate(-15 585 348)"/>
      <ellipse cx="640" cy="348" rx="34" ry="20" fill="#FDE68A" transform="rotate(-15 640 348)"/>
      <!-- Kanpai Toast Banner -->
      <rect x="275" y="95" width="250" height="72" rx="16" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
      <text x="400" y="140" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="26" fill="#92400E">乾杯 · 会食マナー</text>
    
</svg>
