<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Kyoto Shrine and Matcha">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4EC"/>
      <stop offset="100%" stop-color="#FDE2D2"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Kyoto hills & bamboo -->
      <path d="M0 355 Q200 285 450 340 T800 325 L800 500 L0 500 Z" fill="#A7C9A5"/>
      <line x1="75" y1="0" x2="75" y2="380" stroke="#4D7C5F" stroke-width="14"/>
      <line x1="115" y1="0" x2="115" y2="380" stroke="#659B76" stroke-width="10"/>
      <!-- Vermilion Torii Gate -->
      <path d="M180 120 Q360 148 540 120 L550 145 Q360 172 170 145 Z" fill="#DC2626" stroke="#3B5259" stroke-width="3"/>
      <rect x="205" y="182" width="310" height="22" rx="4" fill="#DC2626" stroke="#3B5259" stroke-width="2.5"/>
      <rect x="240" y="150" width="28" height="220" fill="#DC2626" stroke="#3B5259" stroke-width="3"/>
      <rect x="452" y="150" width="28" height="220" fill="#DC2626" stroke="#3B5259" stroke-width="3"/>
      <rect x="342" y="152" width="36" height="44" rx="4" fill="#1E293B"/>
      <!-- Matcha Bowl & Wagashi Dango on Foreground Tray -->
      <rect x="485" y="345" width="270" height="115" rx="16" fill="#FFFFFF" stroke="#3B5259" stroke-width="3"/>
      <path d="M515 385 Q515 440 575 440 Q635 440 635 385 Z" fill="#1E293B" stroke="#3B5259" stroke-width="2.5"/>
      <ellipse cx="575" cy="385" rx="60" ry="18" fill="#4ADE80" stroke="#3B5259" stroke-width="2"/>
      <!-- Sanshoku Dango -->
      <line x1="660" y1="428" x2="735" y2="375" stroke="#92400E" stroke-width="4"/>
      <circle cx="680" cy="414" r="14" fill="#4ADE80" stroke="#3B5259" stroke-width="2"/>
      <circle cx="702" cy="398" r="14" fill="#FFFFFF" stroke="#3B5259" stroke-width="2"/>
      <circle cx="724" cy="382" r="14" fill="#F9A8D4" stroke="#3B5259" stroke-width="2"/>
    
</svg>
