<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Schedule Coordination">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Desk Calendar -->
      <rect x="110" y="95" width="305" height="295" rx="20" fill="#FFFFFF" stroke="#3B5259" stroke-width="3.5"/>
      <rect x="110" y="95" width="305" height="58" rx="18" fill="#0D9488"/>
      <text x="262" y="133" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">日程調整 · SCHEDULE</text>
      <!-- Calendar Grid with Reschedule Arrow -->
      <rect x="142" y="185" width="66" height="58" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/>
      <text x="175" y="222" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#DC2626">14</text>
      <path d="M222 214 L292 214" stroke="#0D9488" stroke-width="6" stroke-linecap="round"/>
      <polygon points="288,200 312,214 288,228" fill="#0D9488"/>
      <rect x="322" y="185" width="66" height="58" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="3"/>
      <text x="355" y="222" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#0F766E">18</text>
      <text x="262" y="315" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="#475569">あいにく都合がつかず…</text>
      <text x="262" y="346" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="17" fill="#0D9488">別日程をご提案 ✓</text>
      <!-- Polite Email Card & Tea on Right -->
      <rect x="465" y="125" width="235" height="175" rx="16" fill="#FFFFFF" stroke="#3B5259" stroke-width="3"/>
      <polygon points="465,135 582,215 700,135" fill="#E0F2FE" stroke="#3B5259" stroke-width="2.5"/>
      <text x="582" y="272" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#0F766E">恐れ入りますが…</text>
    
</svg>
