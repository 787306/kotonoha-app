<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Tokyo Konbini and Subway Sign">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6F6F5"/>
      <stop offset="100%" stop-color="#CBECE8"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Sky & distant Tokyo skyline -->
      <rect x="0" y="340" width="800" height="160" fill="#D9E2E6"/>
      <rect x="0" y="330" width="800" height="14" fill="#B9C8CE"/>
      <rect x="40" y="95" width="95" height="235" rx="6" fill="#C7DFDE"/>
      <rect x="650" y="75" width="110" height="255" rx="6" fill="#C7DFDE"/>
      <!-- Konbini Building -->
      <rect x="135" y="120" width="470" height="220" rx="12" fill="#FFFFFF" stroke="#3B5259" stroke-width="3"/>
      <!-- Iconic 3-stripe Konbini fascia -->
      <rect x="130" y="112" width="480" height="52" rx="8" fill="#FFFFFF" stroke="#3B5259" stroke-width="3"/>
      <rect x="132" y="118" width="476" height="11" fill="#F97316"/>
      <rect x="132" y="132" width="476" height="11" fill="#10B981"/>
      <rect x="132" y="146" width="476" height="11" fill="#0EA5E9"/>
      <!-- 24H Badge -->
      <rect x="495" y="115" width="86" height="44" rx="8" fill="#FFFFFF" stroke="#3B5259" stroke-width="2.5"/>
      <text x="538" y="144" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#0D9488">24H</text>
      <!-- Glass storefront & interior shelves -->
      <rect x="158" y="182" width="280" height="158" rx="6" fill="#EFFAF9" stroke="#3B5259" stroke-width="2.5"/>
      <!-- Onigiri / Bento shelf visible inside -->
      <rect x="175" y="218" width="130" height="10" rx="3" fill="#CBD5E1"/>
      <rect x="175" y="258" width="130" height="10" rx="3" fill="#CBD5E1"/>
      <!-- Onigiri triangles -->
      <polygon points="195,216 208,195 221,216" fill="#FFFFFF" stroke="#3B5259" stroke-width="2"/>
      <rect x="203" y="208" width="10" height="8" fill="#1E293B"/>
      <polygon points="232,216 245,195 258,216" fill="#FFFFFF" stroke="#3B5259" stroke-width="2"/>
      <rect x="240" y="208" width="10" height="8" fill="#1E293B"/>
      <polygon points="269,216 282,195 295,216" fill="#FFFFFF" stroke="#3B5259" stroke-width="2"/>
      <rect x="277" y="208" width="10" height="8" fill="#1E293B"/>
      <!-- Drink bottles -->
      <rect x="186" y="232" width="16" height="24" rx="4" fill="#34D399" stroke="#3B5259" stroke-width="1.8"/>
      <rect x="208" y="232" width="16" height="24" rx="4" fill="#FBBF24" stroke="#3B5259" stroke-width="1.8"/>
      <rect x="230" y="232" width="16" height="24" rx="4" fill="#60A5FA" stroke="#3B5259" stroke-width="1.8"/>
      <rect x="252" y="232" width="16" height="24" rx="4" fill="#FB7185" stroke="#3B5259" stroke-width="1.8"/>
      <!-- Automatic Sliding Door -->
      <rect x="456" y="182" width="128" height="158" rx="6" fill="url(#glass)" stroke="#3B5259" stroke-width="2.5"/>
      <line x1="520" y1="182" x2="520" y2="340" stroke="#3B5259" stroke-width="2.5"/>
      <rect x="464" y="252" width="112" height="10" rx="2" fill="#0D9488" opacity="0.65"/>
      <!-- Subway Direction Signpost on Right -->
      <rect x="658" y="170" width="8" height="185" fill="#3B5259"/>
      <rect x="615" y="180" width="135" height="68" rx="10" fill="#0F766E" stroke="#3B5259" stroke-width="2.5"/>
      <circle cx="642" cy="214" r="14" fill="#FFFFFF"/>
      <text x="642" y="220" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="16" fill="#0F766E">M</text>
      <text x="698" y="209" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">出口 B2</text>
      <text x="698" y="231" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="13" fill="#A7F3D0">駅 → 100m</text>
      <!-- Street tree -->
      <rect x="74" y="280" width="14" height="65" rx="4" fill="#9A6B46"/>
      <circle cx="81" cy="248" r="44" fill="#6EE7B7" stroke="#3B5259" stroke-width="2.5"/>
    
</svg>
