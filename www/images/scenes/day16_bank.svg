<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Bank Account and Mobile SIM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF8F7"/>
      <stop offset="100%" stop-color="#D6EEEC"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Bank Passbook (Tsucho) -->
      <rect x="105" y="100" width="295" height="205" rx="18" fill="#0F766E" stroke="#3B5259" stroke-width="3.5"/>
      <rect x="105" y="148" width="295" height="32" fill="#14B8A6"/>
      <text x="252" y="136" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">東京銀行 · 総合口座通帳</text>
      <rect x="135" y="210" width="60" height="44" rx="8" fill="#FDE68A" stroke="#3B5259" stroke-width="2"/>
      <text x="295" y="242" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="#CCFBF1">¥ 150,000</text>
      <!-- Cash Card -->
      <rect x="160" y="275" width="240" height="142" rx="16" fill="#FFFFFF" stroke="#0D9488" stroke-width="3"/>
      <rect x="184" y="305" width="46" height="34" rx="6" fill="#FBBF24" stroke="#3B5259" stroke-width="2"/>
      <text x="315" y="328" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="16" fill="#0F766E">CASH CARD</text>
      <text x="280" y="385" text-anchor="middle" font-family="monospace" font-weight="700" font-size="17" fill="#475569">1234 •••• 5678</text>
      <!-- Smartphone & SIM Card on Right -->
      <rect x="505" y="80" width="185" height="340" rx="26" fill="#1E293B" stroke="#3B5259" stroke-width="3.5"/>
      <rect x="519" y="106" width="157" height="288" rx="14" fill="#F0FDF4"/>
      <text x="597" y="160" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#0D9488">5G SIM</text>
      <!-- Gold SIM Chip -->
      <path d="M555 190 L620 190 L640 212 L640 292 L555 292 Z" fill="#FBBF24" stroke="#3B5259" stroke-width="3"/>
      <rect x="572" y="216" width="50" height="54" rx="6" fill="#FDE68A" stroke="#3B5259" stroke-width="2"/>
      <text x="597" y="346" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#059669">開通完了 ✓</text>
    
</svg>
