<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Networking and Self Introduction">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Tokyo Networking Lounge Background -->
      <circle cx="245" cy="175" r="56" fill="#0D9488"/>
      <path d="M165 340 Q165 255 245 255 Q325 255 325 340 Z" fill="#14B8A6"/>
      <circle cx="555" cy="175" r="56" fill="#6366F1"/>
      <path d="M475 340 Q475 255 555 255 Q635 255 635 340 Z" fill="#818CF8"/>
      <!-- Speech Bubbles -->
      <rect x="275" y="75" width="250" height="72" rx="22" fill="#FFFFFF" stroke="#0D9488" stroke-width="3"/>
      <text x="400" y="118" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#0F766E">はじめまして！</text>
      <!-- Business Card Exchange Center -->
      <rect x="295" y="310" width="210" height="125" rx="14" fill="#FFFFFF" stroke="#3B5259" stroke-width="3.5"/>
      <rect x="320" y="335" width="48" height="48" rx="12" fill="#CCFBF1"/>
      <text x="344" y="367" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="24" fill="#0D9488">葉</text>
      <text x="435" y="356" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="16" fill="#0F172A">TOKYO MEETUP</text>
      <text x="435" y="380" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="13" fill="#64748B">よろしくお願いします</text>
      <line x1="320" y1="406" x2="480" y2="406" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    
</svg>
