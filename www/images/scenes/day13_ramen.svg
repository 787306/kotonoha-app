<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Shinjuku Ramen Shop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF4E8"/>
      <stop offset="100%" stop-color="#F8DFC4"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Wooden Ramen Counter -->
      <rect x="0" y="345" width="800" height="155" fill="url(#wood)" stroke="#3B5259" stroke-width="3"/>
      <!-- Red Ramen Noren at top -->
      <rect x="110" y="0" width="135" height="92" rx="6" fill="#DC2626"/>
      <rect x="260" y="0" width="135" height="92" rx="6" fill="#DC2626"/>
      <rect x="410" y="0" width="135" height="92" rx="6" fill="#DC2626"/>
      <text x="327" y="62" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="32" fill="#FEF3C7">らーめん</text>
      <!-- Steam lines -->
      <path d="M310 185 Q295 155 315 130" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <path d="M370 175 Q355 145 375 120" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <path d="M430 185 Q415 155 435 130" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <!-- Big Ramen Bowl -->
      <path d="M210 250 Q210 415 375 415 Q540 415 540 250 Z" fill="#1E293B" stroke="#3B5259" stroke-width="3.5"/>
      <ellipse cx="375" cy="250" rx="165" ry="52" fill="#F59E0B" stroke="#3B5259" stroke-width="3"/>
      <!-- Broth & Toppings: Chashu, Egg, Narutomaki, Nori -->
      <rect x="445" y="192" width="52" height="58" rx="4" fill="#1E293B" transform="rotate(14 470 220)"/>
      <ellipse cx="300" cy="246" rx="42" ry="26" fill="#B45309" stroke="#78350F" stroke-width="3"/>
      <ellipse cx="395" cy="238" rx="34" ry="24" fill="#FFFFFF" stroke="#3B5259" stroke-width="2.5"/>
      <circle cx="395" cy="238" r="14" fill="#F97316"/>
      <circle cx="458" cy="260" r="22" fill="#FFFFFF" stroke="#FB7185" stroke-width="3"/>
      <path d="M448 260 Q458 248 468 260 Q458 272 448 260" fill="none" stroke="#FB7185" stroke-width="3"/>
      <!-- Chopsticks -->
      <line x1="250" y1="210" x2="565" y2="270" stroke="#78350F" stroke-width="7" stroke-linecap="round"/>
      <line x1="255" y1="226" x2="568" y2="284" stroke="#92400E" stroke-width="7" stroke-linecap="round"/>
      <!-- Ticket Machine Mini Card -->
      <rect x="615" y="135" width="130" height="190" rx="14" fill="#FFFFFF" stroke="#3B5259" stroke-width="3"/>
      <rect x="632" y="155" width="96" height="28" rx="6" fill="#DC2626"/>
      <text x="680" y="174" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">食券機</text>
      <rect x="635" y="198" width="40" height="24" rx="4" fill="#FEF3C7" stroke="#3B5259" stroke-width="1.5"/>
      <rect x="685" y="198" width="40" height="24" rx="4" fill="#DCFCE7" stroke="#3B5259" stroke-width="1.5"/>
      <rect x="635" y="232" width="40" height="24" rx="4" fill="#E0F2FE" stroke="#3B5259" stroke-width="1.5"/>
      <rect x="685" y="232" width="40" height="24" rx="4" fill="#FCE7F3" stroke="#3B5259" stroke-width="1.5"/>
    
</svg>
