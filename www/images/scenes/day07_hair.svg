<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Tokyo Hair Salon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3FAF8"/>
      <stop offset="100%" stop-color="#E2F2EE"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Salon Floor -->
      <rect x="0" y="370" width="800" height="130" fill="#EAE2D7"/>
      <!-- Large Oval Salon Mirror -->
      <rect x="210" y="45" width="380" height="255" rx="28" fill="#FFFFFF" stroke="#C89F72" stroke-width="10"/>
      <rect x="224" y="59" width="352" height="227" rx="18" fill="#E6F8F6"/>
      <line x1="255" y1="130" x2="335" y2="75" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
      <!-- Salon Counter -->
      <rect x="175" y="302" width="450" height="26" rx="8" fill="url(#wood)" stroke="#3B5259" stroke-width="2.5"/>
      <!-- Styling Chair -->
      <rect x="330" y="330" width="140" height="85" rx="22" fill="#0D9488" stroke="#3B5259" stroke-width="3"/>
      <rect x="390" y="415" width="20" height="45" fill="#64748B"/>
      <ellipse cx="400" cy="462" rx="58" ry="12" fill="#94A3B8" stroke="#3B5259" stroke-width="2"/>
      <!-- Hair Dryer & Scissors on Counter -->
      <g transform="translate(210,255)">
        <rect x="0" y="10" width="54" height="26" rx="10" fill="#F472B6" stroke="#3B5259" stroke-width="2.2"/>
        <rect x="22" y="34" width="14" height="26" rx="5" fill="#334155"/>
        <polygon points="54,14 68,8 68,38 54,32" fill="#CBD5E1" stroke="#3B5259" stroke-width="2"/>
      </g>
      <!-- Scissors -->
      <g transform="translate(520,255)">
        <line x1="15" y1="35" x2="65" y2="10" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
        <line x1="15" y1="15" x2="65" y2="40" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
        <circle cx="10" cy="14" r="9" fill="none" stroke="#0D9488" stroke-width="3.5"/>
        <circle cx="10" cy="36" r="9" fill="none" stroke="#0D9488" stroke-width="3.5"/>
      </g>
      <!-- Potted Plant -->
      <rect x="670" y="330" width="56" height="58" rx="8" fill="#D97706" stroke="#3B5259" stroke-width="2.5"/>
      <ellipse cx="698" cy="290" rx="34" ry="48" fill="#34D399" stroke="#3B5259" stroke-width="2.5"/>
    
</svg>
