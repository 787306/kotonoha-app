<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Rainy Season and Hydrangea">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Soft Clouds & Raindrops -->
      <circle cx="185" cy="115" r="48" fill="#FFFFFF"/>
      <circle cx="235" cy="105" r="56" fill="#FFFFFF"/>
      <circle cx="290" cy="118" r="44" fill="#FFFFFF"/>
      <line x1="170" y1="180" x2="155" y2="225" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
      <line x1="230" y1="185" x2="215" y2="230" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
      <line x1="290" y1="180" x2="275" y2="225" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
      <line x1="620" y1="120" x2="605" y2="165" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
      <!-- Clear Japanese Vinyl Umbrella -->
      <path d="M245 315 A145 145 0 0 1 535 315 Z" fill="#FFFFFF" fill-opacity="0.72" stroke="#3B5259" stroke-width="3.5"/>
      <path d="M390 170 L390 420 A20 20 0 0 1 350 420" fill="none" stroke="#3B5259" stroke-width="6" stroke-linecap="round"/>
      <!-- Hydrangea (Ajisai) Flowers -->
      <g transform="translate(585,340)">
        <circle cx="0" cy="0" r="32" fill="#818CF8"/>
        <circle cx="26" cy="-16" r="28" fill="#A5B4FC"/>
        <circle cx="48" cy="6" r="28" fill="#6366F1"/>
        <circle cx="22" cy="22" r="26" fill="#C4B5FD"/>
      </g>
      <!-- Cute Teru Teru Bozu -->
      <line x1="640" y1="0" x2="640" y2="85" stroke="#3B5259" stroke-width="3"/>
      <circle cx="640" cy="110" r="26" fill="#FFFFFF" stroke="#3B5259" stroke-width="2.5"/>
      <path d="M618 132 L662 132 L674 182 L606 182 Z" fill="#FFFFFF" stroke="#3B5259" stroke-width="2.5"/>
      <line x1="618" y1="136" x2="662" y2="136" stroke="#FB7185" stroke-width="6"/>
    
</svg>
