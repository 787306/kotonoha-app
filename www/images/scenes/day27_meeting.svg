<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Online Video Meeting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Large Monitor / Laptop Screen -->
      <rect x="115" y="55" width="570" height="330" rx="22" fill="#1E293B" stroke="#3B5259" stroke-width="4"/>
      <rect x="135" y="75" width="530" height="270" rx="12" fill="#F8FAFC"/>
      <!-- 4 Video Call Tiles -->
      <rect x="152" y="92" width="240" height="112" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/>
      <circle cx="272" cy="136" r="24" fill="#0D9488"/>
      <rect x="242" y="166" width="60" height="26" rx="12" fill="#14B8A6"/>
      <rect x="408" y="92" width="240" height="112" rx="10" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.5"/>
      <!-- Shared Chart Screen -->
      <rect x="438" y="152" width="26" height="36" rx="4" fill="#6366F1"/>
      <rect x="478" y="132" width="26" height="56" rx="4" fill="#0D9488"/>
      <rect x="518" y="114" width="26" height="74" rx="4" fill="#F59E0B"/>
      <rect x="558" y="102" width="26" height="86" rx="4" fill="#10B981"/>
      <rect x="152" y="216" width="240" height="112" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="272" cy="260" r="24" fill="#F59E0B"/>
      <rect x="408" y="216" width="240" height="112" rx="10" fill="#FCE7F3" stroke="#EC4899" stroke-width="2"/>
      <circle cx="528" cy="260" r="24" fill="#EC4899"/>
      <!-- Call Controls Bar -->
      <rect x="300" y="352" width="200" height="24" rx="12" fill="#334155"/>
      <circle cx="350" cy="364" r="7" fill="#10B981"/>
      <circle cx="400" cy="364" r="7" fill="#38BDF8"/>
      <circle cx="450" cy="364" r="7" fill="#EF4444"/>
      <!-- Laptop Base -->
      <polygon points="85,388 715,388 745,420 55,420" fill="#CBD5E1" stroke="#3B5259" stroke-width="3"/>
    
</svg>
