<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Tokyo Optical Shop and Custom Eyeglasses">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDF9F8"/>
      <stop offset="100%" stop-color="#D9F0EE"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Stylish Optical Boutique Display Shelf Left -->
  <rect x="65" y="55" width="380" height="260" rx="18" fill="#FFFFFF" stroke="#3B5259" stroke-width="3.5"/>
  <rect x="85" y="132" width="340" height="12" rx="4" fill="url(#wood)"/>
  <rect x="85" y="218" width="340" height="12" rx="4" fill="url(#wood)"/>
  <!-- Display Glasses Row 1 -->
  <g stroke="#3B5259" stroke-width="3" fill="#E0F2FE">
    <circle cx="135" cy="108" r="18"/><circle cx="182" cy="108" r="18"/>
    <line x1="153" y1="108" x2="164" y2="108"/>
  </g>
  <g stroke="#B45309" stroke-width="3.5" fill="#FEF3C7">
    <rect x="232" y="92" width="40" height="30" rx="10"/><rect x="284" y="92" width="40" height="30" rx="10"/>
    <line x1="272" y1="105" x2="284" y2="105"/>
  </g>
  <g stroke="#0F766E" stroke-width="3.5" fill="#CCFBF1">
    <circle cx="362" cy="108" r="16"/><circle cx="404" cy="108" r="16"/>
    <line x1="378" y1="108" x2="388" y2="108"/>
  </g>
  <!-- Display Glasses Row 2 -->
  <g stroke="#1E293B" stroke-width="3.5" fill="#F1F5F9">
    <rect x="115" y="178" width="42" height="28" rx="8"/><rect x="168" y="178" width="42" height="28" rx="8"/>
    <line x1="157" y1="190" x2="168" y2="190"/>
  </g>
  <g stroke="#E11D48" stroke-width="3" fill="#FFE4E6">
    <circle cx="268" cy="192" r="18"/><circle cx="315" cy="192" r="18"/>
    <line x1="286" y1="192" x2="297" y2="192"/>
  </g>
  <!-- Vision Test Chart (Landolt C) on Right Wall -->
  <rect x="490" y="55" width="245" height="260" rx="18" fill="#FFFFFF" stroke="#3B5259" stroke-width="3.5"/>
  <rect x="520" y="75" width="185" height="34" rx="8" fill="#0D9488"/>
  <text x="612" y="98" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">視力検査 · EYE TEST</text>
  <!-- Large Landolt C -->
  <path d="M636 168 A32 32 0 1 1 636 146" fill="none" stroke="#0F172A" stroke-width="13" stroke-linecap="butt"/>
  <!-- Medium Landolt Cs -->
  <path d="M555 215 A17 17 0 1 1 567 215" fill="none" stroke="#334155" stroke-width="7"/>
  <path d="M625 225 A17 17 0 1 0 625 213" fill="none" stroke="#334155" stroke-width="7"/>
  <path d="M666 226 A17 17 0 1 1 666 214" fill="none" stroke="#334155" stroke-width="7"/>
  <text x="612" y="286" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#0F766E">BLUE LIGHT CUT · 30分</text>
  <!-- Foreground Wooden Fitting Counter -->
  <rect x="0" y="340" width="800" height="160" fill="url(#wood)" stroke="#3B5259" stroke-width="3"/>
  <!-- Hero Custom Eyeglasses on Display Tray -->
  <rect x="135" y="365" width="320" height="100" rx="18" fill="#FFFDF8" stroke="#3B5259" stroke-width="3"/>
  <g stroke="#0F172A" stroke-width="6" fill="#BAE6FD" fill-opacity="0.55">
    <rect x="182" y="388" width="94" height="58" rx="22"/>
    <rect x="314" y="388" width="94" height="58" rx="22"/>
    <path d="M276 412 Q295 400 314 412" fill="none"/>
  </g>
  <line x1="200" y1="402" x2="226" y2="426" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <line x1="332" y1="402" x2="358" y2="426" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <!-- Glasses Case & Microfiber Cloth -->
  <rect x="505" y="375" width="195" height="82" rx="24" fill="#0D9488" stroke="#3B5259" stroke-width="3"/>
  <line x1="505" y1="416" x2="700" y2="416" stroke="#0F766E" stroke-width="3"/>
  <text x="602" y="405" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="14" fill="#CCFBF1">SHIBUYA OPTICAL</text>
</svg>
