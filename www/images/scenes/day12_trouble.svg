<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Shinjuku Train Delay and Lost Item">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF2F7"/>
      <stop offset="100%" stop-color="#D5E3EE"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Station Platform & Overhead Delay Board -->
      <rect x="0" y="375" width="800" height="125" fill="#CBD5E1"/>
      <rect x="0" y="375" width="800" height="16" fill="#FACC15"/>
      <!-- Digital Train Delay Board -->
      <rect x="190" y="35" width="420" height="92" rx="12" fill="#1E293B" stroke="#3B5259" stroke-width="3.5"/>
      <text x="400" y="75" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#FB923C">山手線 · 遅延 15分</text>
      <text x="400" y="108" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="16" fill="#6EE7B7">新宿駅 3番線 · 遅延証明書</text>
      <!-- Japanese Yamanote-style Commuter Train -->
      <rect x="75" y="170" width="465" height="198" rx="22" fill="#F8FAFC" stroke="#3B5259" stroke-width="3.5"/>
      <rect x="75" y="275" width="465" height="24" fill="#84CC16"/>
      <rect x="115" y="200" width="90" height="62" rx="8" fill="#BAE6FD" stroke="#3B5259" stroke-width="2.5"/>
      <rect x="230" y="200" width="90" height="62" rx="8" fill="#BAE6FD" stroke="#3B5259" stroke-width="2.5"/>
      <rect x="345" y="200" width="90" height="62" rx="8" fill="#BAE6FD" stroke="#3B5259" stroke-width="2.5"/>
      <rect x="460" y="200" width="55" height="145" rx="8" fill="#E0F2FE" stroke="#3B5259" stroke-width="2.5"/>
      <!-- Lost & Found Umbrella Card on Right -->
      <rect x="575" y="195" width="165" height="175" rx="16" fill="#FFFFFF" stroke="#0D9488" stroke-width="3"/>
      <path d="M615 268 A44 44 0 0 1 703 268 Z" fill="#0EA5E9" stroke="#3B5259" stroke-width="2.5"/>
      <line x1="659" y1="268" x2="659" y2="320" stroke="#3B5259" stroke-width="4"/>
      <path d="M659 320 A10 10 0 0 1 639 320" fill="none" stroke="#3B5259" stroke-width="4"/>
      <text x="658" y="352" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#0F766E">忘れ物窓口</text>
    
</svg>
