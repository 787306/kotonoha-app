<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Japanese Job Interview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Conference Room Wall & Table -->
      <rect x="0" y="330" width="800" height="170" fill="url(#wood)" stroke="#3B5259" stroke-width="3"/>
      <!-- Clean Resume (Rirekisho) Document -->
      <rect x="130" y="85" width="245" height="310" rx="14" fill="#FFFFFF" stroke="#3B5259" stroke-width="3.5"/>
      <text x="252" y="128" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#0F172A">履 歴 書</text>
      <rect x="290" y="145" width="60" height="74" rx="6" fill="#DBEAFE" stroke="#3B5259" stroke-width="2"/>
      <line x1="158" y1="162" x2="270" y2="162" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
      <line x1="158" y1="190" x2="270" y2="190" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
      <line x1="158" y1="248" x2="345" y2="248" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
      <line x1="158" y1="278" x2="345" y2="278" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
      <line x1="158" y1="308" x2="310" y2="308" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
      <rect x="158" y="335" width="115" height="32" rx="8" fill="#CCFBF1"/>
      <text x="215" y="356" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#0F766E">志望動機 ✓</text>
      <!-- Interviewer Badge & Briefcase -->
      <rect x="445" y="145" width="240" height="130" rx="18" fill="#FFFFFF" stroke="#0D9488" stroke-width="3"/>
      <text x="565" y="198" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="20" fill="#0F172A">最終面接 · 会議室A</text>
      <text x="565" y="234" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="15" fill="#0D9488">御社を志望した理由は…</text>
      <!-- Leather Briefcase -->
      <rect x="475" y="305" width="180" height="115" rx="14" fill="#334155" stroke="#3B5259" stroke-width="3"/>
      <path d="M535 305 V285 H595 V305" fill="none" stroke="#3B5259" stroke-width="6"/>
      <rect x="550" y="352" width="30" height="16" rx="4" fill="#FBBF24"/>
    
</svg>
