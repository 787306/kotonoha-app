<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Omotesando Select Shop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF8F4"/>
      <stop offset="100%" stop-color="#F3EAE2"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Boutique Wall & Floor -->
      <rect x="0" y="365" width="800" height="135" fill="#E6D5C3"/>
      <line x1="0" y1="365" x2="800" y2="365" stroke="#3B5259" stroke-width="2.5"/>
      <!-- Arched Boutique Mirror -->
      <path d="M110 365 L110 140 A75 75 0 0 1 260 140 L260 365 Z" fill="#E7F6F5" stroke="#C89F72" stroke-width="8"/>
      <path d="M135 160 L195 100" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
      <path d="M140 215 L220 135" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
      <!-- Clothing Rack -->
      <line x1="330" y1="145" x2="650" y2="145" stroke="#3B5259" stroke-width="6" stroke-linecap="round"/>
      <line x1="350" y1="145" x2="350" y2="365" stroke="#3B5259" stroke-width="5"/>
      <line x1="630" y1="145" x2="630" y2="365" stroke="#3B5259" stroke-width="5"/>
      <!-- Stylish Coats/Shirts on Hangers -->
      <path d="M375 180 L405 160 L435 180 L430 290 L380 290 Z" fill="#5EEAD4" stroke="#3B5259" stroke-width="2.5"/>
      <path d="M445 180 L480 160 L515 180 L508 305 L452 305 Z" fill="#FDE68A" stroke="#3B5259" stroke-width="2.5"/>
      <path d="M525 180 L560 160 L595 180 L590 295 L530 295 Z" fill="#FCA5A5" stroke="#3B5259" stroke-width="2.5"/>
      <!-- Shopping Bags on Floor -->
      <rect x="460" y="325" width="76" height="86" rx="6" fill="#0D9488" stroke="#3B5259" stroke-width="2.5"/>
      <path d="M482 325 Q498 298 514 325" fill="none" stroke="#3B5259" stroke-width="3"/>
      <rect x="550" y="340" width="66" height="72" rx="6" fill="#F59E0B" stroke="#3B5259" stroke-width="2.5"/>
      <path d="M568 340 Q583 318 598 340" fill="none" stroke="#3B5259" stroke-width="3"/>
      <!-- TAX FREE Sign -->
      <rect x="650" y="105" width="115" height="66" rx="12" fill="#FFFFFF" stroke="#0D9488" stroke-width="3"/>
      <text x="707" y="135" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="18" fill="#0D9488">TAX FREE</text>
      <text x="707" y="157" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="13" fill="#475569">免税 10%</text>
    
</svg>
