<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Japanese Karaoke Room">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Neon Karaoke Screen -->
      <rect x="135" y="55" width="530" height="225" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
      <text x="400" y="148" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="34" fill="#F472B6">♪ KARAOKE 98点 ♪</text>
      <text x="400" y="198" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="22" fill="#5EEAD4">みんなで歌おう！</text>
      <!-- Disco Glows -->
      <circle cx="110" cy="90" r="32" fill="#F472B6" opacity="0.35"/>
      <circle cx="695" cy="110" r="40" fill="#38BDF8" opacity="0.35"/>
      <!-- Two Microphones -->
      <g transform="rotate(-25 320 370)">
        <circle cx="320" cy="315" r="28" fill="#CBD5E1" stroke="#3B5259" stroke-width="3"/>
        <rect x="307" y="340" width="26" height="105" rx="8" fill="#1E293B" stroke="#E2E8F0" stroke-width="2"/>
      </g>
      <g transform="rotate(25 480 370)">
        <circle cx="480" cy="315" r="28" fill="#F9A8D4" stroke="#3B5259" stroke-width="3"/>
        <rect x="467" y="340" width="26" height="105" rx="8" fill="#1E293B" stroke="#E2E8F0" stroke-width="2"/>
      </g>
      <!-- Musical Notes -->
      <text x="165" y="395" font-family="sans-serif" font-size="52" fill="#FDE047">♫</text>
      <text x="615" y="395" font-family="sans-serif" font-size="52" fill="#5EEAD4">♪</text>
    
</svg>
