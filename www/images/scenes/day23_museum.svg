<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Art Museum Exhibition">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F7F4"/>
      <stop offset="100%" stop-color="#ECE9E2"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Gallery Floor -->
      <rect x="0" y="365" width="800" height="135" fill="#DFD8CE"/>
      <!-- Spotlights -->
      <polygon points="180,35 100,260 260,260" fill="#FEF9C3" opacity="0.45"/>
      <polygon points="400,35 310,260 490,260" fill="#FEF9C3" opacity="0.45"/>
      <polygon points="620,35 540,260 700,260" fill="#FEF9C3" opacity="0.45"/>
      <!-- Three Framed Artworks -->
      <rect x="115" y="100" width="135" height="175" rx="6" fill="#FFFFFF" stroke="#8C6249" stroke-width="8"/>
      <circle cx="182" cy="175" r="38" fill="#5EEAD4"/>
      <rect x="150" y="200" width="65" height="45" fill="#0F766E"/>
      <rect x="315" y="85" width="170" height="205" rx="6" fill="#FFFFFF" stroke="#8C6249" stroke-width="9"/>
      <circle cx="400" cy="155" r="42" fill="#FBBF24"/>
      <path d="M332 255 Q400 185 468 255 Z" fill="#0284C7"/>
      <rect x="550" y="100" width="135" height="175" rx="6" fill="#FFFFFF" stroke="#8C6249" stroke-width="8"/>
      <path d="M575 235 L617 135 L660 235 Z" fill="#FB7185"/>
      <!-- Gallery Bench -->
      <rect x="245" y="355" width="310" height="28" rx="8" fill="url(#wood)" stroke="#3B5259" stroke-width="3"/>
      <rect x="275" y="383" width="18" height="55" fill="#3B5259"/>
      <rect x="507" y="383" width="18" height="55" fill="#3B5259"/>
    
</svg>
