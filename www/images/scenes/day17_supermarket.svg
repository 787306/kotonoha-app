<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Japanese Supermarket Shopping">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2FBF5"/>
      <stop offset="100%" stop-color="#DEF5E5"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C299"/>
      <stop offset="100%" stop-color="#CFA071"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#D7F3EF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  
      <!-- Produce Shelf -->
      <rect x="80" y="110" width="410" height="260" rx="16" fill="#FFFFFF" stroke="#3B5259" stroke-width="3"/>
      <rect x="105" y="175" width="360" height="16" rx="4" fill="url(#wood)"/>
      <rect x="105" y="265" width="360" height="16" rx="4" fill="url(#wood)"/>
      <!-- Fruits & Veggies -->
      <circle cx="150" cy="152" r="22" fill="#EF4444" stroke="#3B5259" stroke-width="2"/>
      <circle cx="195" cy="152" r="22" fill="#EF4444" stroke="#3B5259" stroke-width="2"/>
      <circle cx="265" cy="152" r="22" fill="#F97316" stroke="#3B5259" stroke-width="2"/>
      <circle cx="310" cy="152" r="22" fill="#FACC15" stroke="#3B5259" stroke-width="2"/>
      <circle cx="385" cy="152" r="24" fill="#22C55E" stroke="#3B5259" stroke-width="2"/>
      <!-- Bento Box with 50% Hangaku Discount Sticker -->
      <rect x="140" y="210" width="135" height="54" rx="10" fill="#FEF3C7" stroke="#3B5259" stroke-width="2.5"/>
      <circle cx="250" cy="220" r="28" fill="#EF4444" stroke="#FFFFFF" stroke-width="3"/>
      <text x="250" y="226" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#FFFFFF">半額</text>
      <rect x="310" y="210" width="125" height="54" rx="10" fill="#E0F2FE" stroke="#3B5259" stroke-width="2.5"/>
      <!-- Shopping Basket on Right -->
      <path d="M535 235 L735 235 L710 385 L560 385 Z" fill="#0D9488" stroke="#3B5259" stroke-width="3.5"/>
      <line x1="585" y1="255" x2="595" y2="365" stroke="#CCFBF1" stroke-width="4"/>
      <line x1="635" y1="255" x2="635" y2="365" stroke="#CCFBF1" stroke-width="4"/>
      <line x1="685" y1="255" x2="675" y2="365" stroke="#CCFBF1" stroke-width="4"/>
      <path d="M575 235 Q635 160 695 235" fill="none" stroke="#3B5259" stroke-width="7" stroke-linecap="round"/>
      <!-- Baguette & Leek sticking out -->
      <ellipse cx="605" cy="200" rx="16" ry="44" fill="#E7C299" stroke="#3B5259" stroke-width="2.5" transform="rotate(-15 605 200)"/>
      <rect x="650" y="160" width="18" height="75" rx="6" fill="#4ADE80" stroke="#3B5259" stroke-width="2.2" transform="rotate(12 658 198)"/>
    
</svg>
